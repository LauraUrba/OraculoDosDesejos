{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Cadastrar Novo Livro</h1>

{% if erros %}
    <div class="alert alert-danger">
        <ul class="mb-0">
            {% for erro in erros %}
                <li>{{ erro }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}

<form method="POST" class="needs-validation">
    <div class="mb-3">
        <label for="titulo" class="form-label">Título do Livro</label>
        <input type="text" class="form-control" id="titulo" name="titulo"
               value="{{ request.form.get('titulo', '') }}" required>
    </div>

    <div class="mb-3">
        <label for="autor" class="form-label">Autor</label>
        <input type="text" class="form-control" id="autor" name="autor"
               value="{{ request.form.get('autor', '') }}" required>
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select class="form-select" id="status" name="status" required>
            <option value="">Selecione um status</option>
            <option value="Quero Ler" {% if request.form.get('status') == 'Quero Ler' %}selected{% endif %}>Quero Ler</option>
            <option value="Lendo" {% if request.form.get('status') == 'Lendo' %}selected{% endif %}>Lendo</option>
            <option value="Lido" {% if request.form.get('status') == 'Lido' %}selected{% endif %}>Lido</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Cadastrar Livro</button>
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
