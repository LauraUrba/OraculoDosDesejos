{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Detalhes do Livro</h1>

<div class="card">
    <div class="card-body">
        <h5 class="card-title">{{ livro.titulo }}</h5>
        <h6 class="card-subtitle mb-2 text-muted">Autor: {{ livro.autor }}</h6>
        <p class="card-text">
            <strong>Status:</strong>
            <span class="badge bg-{% if livro.status == 'Lido' %}success{% elif livro.status == 'Lendo' %}warning{% else %}primary{% endif %}">
                {{ livro.status }}
            </span>
        </p>
        <a href="{{ url_for('editar', editar_id=livro.id) }}" class="btn btn-warning">Editar</a>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Voltar</a>
    </div>
</div>
{% endblock %}
